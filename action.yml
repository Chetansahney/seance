name: 'Séance – Dead Link Scanner'
description: 'Find (and optionally resurrect) dead links in Markdown files using the Wayback Machine.'
author: 'Séance'

inputs:
  files:
    description: 'Space-separated list of files to scan.'
    required: false
    default: 'README.md'
  fix:
    description: "Pass 'true' to rewrite dead links to their Wayback Machine snapshots."
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Scan files for dead links
      shell: bash
      env:
        SEANCE_FILES: ${{ inputs.files }}
        SEANCE_FIX: ${{ inputs.fix }}
      run: |
        failed=0
        for file in $SEANCE_FILES; do
          if [ "$SEANCE_FIX" = "true" ]; then
            node "$GITHUB_ACTION_PATH/bin/seance.js" "$file" --fix || failed=1
          else
            node "$GITHUB_ACTION_PATH/bin/seance.js" "$file" || failed=1
          fi
        done
        exit $failed
